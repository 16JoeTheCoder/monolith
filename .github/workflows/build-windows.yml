# Builds the Windows installer (NSIS) and portable exe on every push and PR.
# Tags matching v* also attach both files to a GitHub Release.
name: Build Windows

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

      - name: Package (unsigned)
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: Monolith-windows
          path: |
            release/*.exe
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Monolith ${{ github.ref_name }}
          body: See CHANGELOG.md. Download Monolith-Setup-*.exe to install, or Monolith-Portable-*.exe to run without installing.
          files: |
            release/Monolith-Setup-*.exe
            release/Monolith-Portable-*.exe
          fail_on_unmatched_files: true
